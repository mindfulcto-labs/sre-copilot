[build-system]
requires = ["hatchling>=1.24,<2.0"]
build-backend = "hatchling.build"

[project]
name = "sre-copilot"
version = "0.1.0"
description = "Incident triage and runbook execution assistant for SRE work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Venkatesan Ramachandran", email = "venkat@rvenkat.com" }]
keywords = ["sre", "incident-response", "runbook", "triage", "ops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12,<1.0",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "rich>=13.7,<15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.5,<1.0",
]

[project.scripts]
sre-copilot = "sre_copilot.cli:app"

[project.urls]
Homepage = "https://github.com/mindfulcto-labs/sre-copilot"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
